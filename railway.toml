[build]
builder = "nixpacks"

[deploy]
# railway.toml's startCommand overrides nixpacks.toml's [start].cmd entirely (that's why
# the earlier fix there had zero effect — Railway never even looked at it). The frontend
# vite build has to run here, after nixpacks' final `COPY . /app` (build-phase output
# gets clobbered by that copy every deploy, see nixpacks.toml for the full story).
startCommand = "cd frontend && (node_modules/.bin/vite build --outDir ../backend/public || true) && cd ../backend && node_modules/.bin/prisma db push --skip-generate --accept-data-loss && node src/server.js"
