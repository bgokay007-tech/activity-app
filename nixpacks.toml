[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "cd backend && npm ci",
  "cd frontend && npm ci"
]

[phases.build]
cmds = [
  "cd backend && npx prisma generate",
  "cd frontend && npx vite build --outDir ../backend/public"
]

[start]
cmd = "cd backend && npx prisma migrate deploy && node src/server.js"
