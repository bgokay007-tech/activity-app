[phases.setup]
# Vite 8 (frontend) requires node ^20.19.0 || >=22.12.0 — nodejs_20 silently failed to
# satisfy this (npm ci never produced node_modules/.bin/vite, build step no-op'd via
# `|| true`), so backend/public kept serving a stale frontend bundle for a long time.
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "cd backend && npm ci",
  "cd frontend && npm ci || true"
]

[phases.build]
cmds = [
  "cd backend && node_modules/.bin/prisma generate",
  "cd frontend && node_modules/.bin/vite build --outDir ../backend/public || true"
]

[start]
cmd = "cd backend && node_modules/.bin/prisma db push --skip-generate --accept-data-loss && node src/server.js"
