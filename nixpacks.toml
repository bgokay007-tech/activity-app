[phases.setup]
# The earlier "old node version" diagnosis was a red herring: even after fetching a
# fresh Node 22 binary and using it explicitly (see git history), `npm ci` for frontend
# STILL only installed ~101 of ~494 packages, silently dropping vite's own bin. The real
# cause is nixpacks setting NODE_ENV=production globally for the whole build — npm ci
# skips devDependencies (vite, eslint, @vitejs/plugin-react...) under NODE_ENV=production
# unless told otherwise. `--include=dev` below forces them in regardless of node version,
# so nodejs_20 (whatever patch this nixpkgs snapshot has) is fine again.
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "cd backend && npm ci",
  "cd frontend && npm ci --include=dev || true"
]

[phases.build]
cmds = [
  "cd backend && node_modules/.bin/prisma generate",
  "cd frontend && node_modules/.bin/vite build --outDir ../backend/public || true"
]

[start]
cmd = "cd backend && node_modules/.bin/prisma db push --skip-generate --accept-data-loss && node src/server.js"
