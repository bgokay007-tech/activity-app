[phases.setup]
# nodejs_20 in this pinned nixpkgs snapshot resolves to v20.6.1, which is below the
# ^20.19.0 minimum required by current frontend deps (vite@8, eslint@10, @vitejs/plugin-react@6).
# npm ci was silently failing (EBADENGINE + vite binary missing) and `|| true` swallowed
# it, so the frontend was never actually rebuilt on deploy — it kept serving whatever
# bundle happened to be committed in backend/public. nodejs_22 satisfies the range.
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "cd backend && npm ci",
  "cd frontend && npm ci || true"
]

[phases.build]
cmds = [
  "cd backend && node_modules/.bin/prisma generate",
  "cd frontend && node_modules/.bin/vite build --outDir ../backend/public || true"
]

[start]
cmd = "cd backend && node_modules/.bin/prisma db push --skip-generate --accept-data-loss && node src/server.js"
