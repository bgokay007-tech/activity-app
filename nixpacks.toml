[phases.setup]
# nodejs_22 doesn't exist in this pinned nixpkgs snapshot (build error: "undefined
# variable 'nodejs_22'") — reverted to nodejs_20. The actual root cause of the frontend
# build failure was a stale package-lock.json (see frontend/package-lock.json fix),
# not the node version.
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "cd backend && npm ci",
  "cd frontend && npm ci || true"
]

[phases.build]
cmds = [
  "cd backend && node_modules/.bin/prisma generate",
  "cd frontend && node_modules/.bin/vite build --outDir ../backend/public || true"
]

[start]
cmd = "cd backend && node_modules/.bin/prisma db push --skip-generate --accept-data-loss && node src/server.js"
