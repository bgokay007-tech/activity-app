name: EAS Update

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: EAS Update (development)
        working-directory: mobile
        run: npx eas-cli@latest update --channel development --message "${{ github.event.head_commit.message }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Update (preview)
        working-directory: mobile
        run: npx eas-cli@latest update --channel preview --message "${{ github.event.head_commit.message }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
